name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Install dependencies
        run: flutter pub get

      - name: Create apiKeys.dart from template
        run: |
          if (Test-Path "lib/firebase_setup/apiKeys.dart.example") {
            Copy-Item lib/firebase_setup/apiKeys.dart.example lib/firebase_setup/apiKeys.dart -Force
          }
        shell: pwsh

      - name: Apply dart fixes
        run: dart fix --apply .

      - name: Analyze
        run: flutter analyze

      - name: Run tests
        run: flutter test
